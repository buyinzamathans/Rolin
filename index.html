<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Step 1: The Big Question -->
    <div class="card" id="step-1">
        <img src="20260412_183140 (1).jpg" alt="Profile Picture" class="profile-image">
        <h1>🌸 Will you go on a date with me? 🌸</h1>
        <div class="button-container">
            <button id="yes-btn" class="btn yes-btn">YES 💖</button>
            <button id="no-btn" class="btn no-btn">no 💔</button>
        </div>
    </div> 

    <!-- Step 2: The Shock -->
    <div class="card hidden" id="step-2">
        <h1>WAIT YOU ACTUALLY SAID YES?? 🥺</h1>
        <p>I was so ready for you to say no 😭</p>
        <div class="button-container">
            <button id="next-btn" class="btn yes-btn">okay okay! ➔</button>
        </div>
    </div>

        <!-- Step 3: The Ultimate Terms -->
    <div class="card hidden" id="step-3">
        <h1>Tomorrow's Agenda 📋</h1>
        <p>Here are the non-negotiable terms:</p>
        
        <div class="terms-box">
            <p>🍔 <strong>Food:</strong> On me</p>
            <p>🚕 <strong>Transport:</strong> On you</p>
            <p>📍 <strong>Location:</strong> My room</p>
            <p>💨 <strong>Vibe:</strong> Smoke all day if you want</p>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label>What time are you pulling up? ⏰</label>
            <input type="time" id="time-picker" class="input-field">
        </div>

        <div class="button-container">
            <button id="set-date-btn" class="btn yes-btn">accept terms ♥</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
