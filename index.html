<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Card Container -->
    <div class="card" id="step-1">
        
        <!-- Profile Picture -->
        <img src="20260412_183140 (1).jpg" alt="Profile Picture" class="profile-image">
        
        <!-- The Big Question -->
        <h1>🌸 Will you go on a date with me? 🌸</h1>
        
        <!-- The Buttons -->
        <div class="button-container">
            <button id="yes-btn" class="btn yes-btn">YES 💖</button>
            <button id="no-btn" class="btn no-btn">no 💔</button>
        </div>
    <!-- Step 2: The Shock -->
    <div class="card hidden" id="step-2">
        <h1>WAIT YOU ACTUALLY SAID YES?? 🥺</h1>
        <p>I was so ready for you to say no 😭</p>
        <div class="button-container">
            <button id="next-btn" class="btn yes-btn">okay okay! ➔</button>
        </div>
    </div>

    <!-- Step 3: The Calendar -->
    <div class="card hidden" id="step-3">
        <h1>So... when are you free? 📅</h1>
        
        <div class="form-group">
            <label>Pick a Day 💕</label>
            <input type="date" id="date-picker" class="input-field">
        </div>
        
        <div class="form-group">
            <label>What Time? ⏰</label>
            <input type="time" id="time-picker" class="input-field">
        </div>

        <div class="button-container">
            <button id="set-date-btn" class="btn yes-btn">set the date! ♥</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
